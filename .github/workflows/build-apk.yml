name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master", "principal" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Cloner le projet
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Préparer www et installer Capacitor
        run: |
          mkdir -p www
          if [ ! -f www/index.html ]; then echo "<!doctype html><title>FACM</title>" > www/index.html; fi
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          npx cap sync android

      - name: Compiler l'APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Téléverser l'APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: facm-digital-platform-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
